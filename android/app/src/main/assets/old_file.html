<!DOCTYPE html>
<html lang="en">
<head>
    <title>3D Avatar Viewer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: black; 
            width: 100vw;
            height: 100vh;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%;
        }
        #loading { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div id="loading">Loading 3D Model...</div>

<script src="./three.min.js"></script>
<script src="./GLTFLoader.js"></script>

<script>
    let scene, camera, renderer, loader, model;
    let modelUrl = '';
    let isModelLoaded = false;
    let controls;

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Black background

        // Use perspective camera with reasonable defaults
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 4); // Move camera back to see more of the model

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1); // Solid black background
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Improved lighting for better model visibility
        // Ambient light for general illumination
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Front light
        const frontLight = new THREE.DirectionalLight(0xffffff, 0.8);
        frontLight.position.set(0, 2, 5);
        scene.add(frontLight);

        // Side lights for better definition
        const leftLight = new THREE.DirectionalLight(0xffffff, 0.5);
        leftLight.position.set(-5, 1, 2);
        scene.add(leftLight);

        const rightLight = new THREE.DirectionalLight(0xffffff, 0.5);
        rightLight.position.set(5, 1, 2);
        scene.add(rightLight);

        // Top light
        const topLight = new THREE.DirectionalLight(0xffffff, 0.3);
        topLight.position.set(0, 5, 0);
        scene.add(topLight);

        loader = new THREE.GLTFLoader();
        
        window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        // if (model && isModelLoaded) {
        //     model.rotation.y += 0.01;
        // }
        renderer.render(scene, camera);
    }

    // Function to center and scale model appropriately
    function centerAndScaleModel(model) {
        // Create a bounding box for the model
        const bbox = new THREE.Box3().setFromObject(model);
        
        // Get the size of the bounding box
        const size = bbox.getSize(new THREE.Vector3());
        
        // Get the center of the bounding box
        const center = bbox.getCenter(new THREE.Vector3());
        
        // Calculate the scaling factor to fit the model in view
        // We'll scale based on height as that's usually the limiting factor for character models
        const maxDimension = Math.max(size.x, size.y, size.z);
        const scaleFactor = 3.0 / maxDimension; // Adjust for desired size
        
        // Apply scaling to the model
        model.scale.set(scaleFactor, scaleFactor, scaleFactor);
        
        // Move model to center based on its bounding box
        model.position.x = -center.x * scaleFactor;
        model.position.y = -center.y * scaleFactor;
        model.position.z = -center.z * scaleFactor;
        
        // If it's a character model, adjust the Y position to ensure feet are at ground level
        const adjustedBbox = new THREE.Box3().setFromObject(model);
        model.position.y -= adjustedBbox.min.y;
    }

    // Called from C# after the page loads
    function setModel(gender, serverUrl) {
        console.log('Setting model to:', gender);
        
        // Use the provided server URL from Android
        modelUrl = serverUrl + '/' + gender + '.glb';
        console.log('Loading model from:', modelUrl);
        
        // Show loading indicator
        document.getElementById('loading').style.display = 'block';
        
        // Remove previous model if exists
        if (model) {
            scene.remove(model);
            model = null;
        }
        
        // Load the new model
        loader.load(modelUrl, function (gltf) {
            model = gltf.scene;
            
            // Center and scale the model to fit the view
            centerAndScaleModel(model);
            
            scene.add(model);
            isModelLoaded = true;
            document.getElementById('loading').style.display = 'none';
            
            // Ensure animation is running
            if (!isAnimating) {
                isAnimating = true;
                animate();
            }
            
            // Notify Android that model loading succeeded
            if (window.Android) {
                window.Android.modelLoadingComplete(true);
            }
        }, 
        // Progress callback
        function (xhr) {
            const percentComplete = (xhr.loaded / xhr.total) * 100;
            document.getElementById('loading').textContent = 'Loading: ' + Math.round(percentComplete) + '%';
        }, 
        // Error callback
        function (error) {
            console.error('Error loading model:', error);
            document.getElementById('loading').textContent = 'Error loading model!';
            
            // Notify Android that model loading failed
            if (window.Android) {
                window.Android.modelLoadingComplete(false);
            }
        });
    }


    
    // Called from WebAppInterface to update blend shapes
    function updateBlendShapes(blendShapeData, pitch, yaw, roll) {
        if (!model) return;
        
        try {
            model.rotation.x = THREE.MathUtils.degToRad(pitch);
            model.rotation.y = THREE.MathUtils.degToRad(yaw);
            model.rotation.z = -THREE.MathUtils.degToRad(roll);
            const data = JSON.parse(blendShapeData);
            // Apply blend shapes to the model if supported
            // This is placeholder - actual implementation depends on your model structure
            console.log("Received blend shapes:", data, "Pitch:", pitch, "Yaw:", yaw, "Roll:", roll);
        } catch (e) {
            console.error("Error parsing blend shape data:", e);
        }
    }

    let isAnimating = false;
    
    // Initialize the scene but don't load a model yet
    init();
    isAnimating = true;
    animate();
</script>

</body>
</html>
